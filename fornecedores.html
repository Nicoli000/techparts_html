<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fornecedores | Tech Parts</title>
    <link rel="stylesheet" href="/css/fornecedores.css">
</head>
<body>

    <header>
        <h1>TECH PARTS</h1>

        <nav>
            <a href="clientes.html">Clientes</a>
            <a href="produtos.html">Produtos</a>
            <a href="fornecedores.html">Fornecedores</a>
            <a href="estoque.html">Estoque</a>
            <a href="pedidos.html">Pedidos</a>
            <a href="carrinho.html">Carrinho</a>
            <a href="pagamentos.html">Pagamentos</a>
        </nav>
    </header>

    <main>
        <section class="container">
            <h2>Cadastro de Fornecedores</h2>
            <p>Cadastre e gerencie os fornecedores de hardware.</p>

            <form id="formFornecedor">

                <input type="hidden" id="id_fornecedor">

                <div class="campo">
                    <label for="nome">Nome da empresa</label>
                    <input type="text" id="nome" required>
                </div>

                <div class="campo">
                    <label for="cnpj">CNPJ</label>
                    <input type="text" id="cnpj" placeholder="00.000.000/0000-00" required>
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" required>
                </div>

                <div class="campo">
                    <label for="telefone">Telefone</label>
                    <input type="text" id="telefone" required>
                </div>

                <div class="campo">
                    <label for="endereco">Endereço</label>
                    <input type="text" id="endereco">
                </div>

                <div class="campo">
                    <label for="cidade">Cidade</label>
                    <input type="text" id="cidade">
                </div>

                <div class="campo">
                    <label for="uf">Estado (UF)</label>
                    <input type="text" id="uf" maxlength="2">
                </div>

                <div class="botoes">
                    <button type="submit" id="btnSalvar">Cadastrar Fornecedor</button>
                    <button type="button" id="btnLimpar">Limpar</button>
                </div>

            </form>

            <p id="mensagem"></p>
        </section>

        <section class="container">
            <h2>Fornecedores Cadastrados</h2>

            <input type="text" id="pesquisa" placeholder="Pesquisar fornecedor...">

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Empresa</th>
                            <th>CNPJ</th>
                            <th>E-mail</th>
                            <th>Telefone</th>
                            <th>Cidade</th>
                            <th>UF</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="listaFornecedores"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="/js/fornecedores.js"></script>
</body>
</html>
