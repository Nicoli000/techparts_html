<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes | TechParts</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>TechParts</h1>
        <nav>
            <a href="#">Clientes</a>
            <a href="#">Produtos</a>
            <a href="#">Estoque</a>
            <a href="#">Pedidos</a>
        </nav>
    </header>

    <main>

        <section class="titulo">
            <h2>Clientes e Endereços</h2>
            <p>Cadastre clientes e seus endereços de entrega.</p>
        </section>

        <section class="formulario">

            <h3>Cadastrar Cliente</h3>

            <label>Nome</label>
            <input type="text" id="nome" placeholder="Nome completo">

            <label>CPF</label>
            <input type="text" id="cpf" placeholder="CPF">

            <label>E-mail</label>
            <input type="email" id="email" placeholder="E-mail">

            <button onclick="cadastrarCliente()">Cadastrar Cliente</button>

        </section>

        <section class="formulario">

            <h3>Endereço de Entrega</h3>

            <label>Cliente</label>
            <select id="cliente">
                <option value="">Selecione um cliente</option>
            </select>

            <label>CEP</label>
            <input type="text" id="cep" placeholder="CEP">

            <label>Rua</label>
            <input type="text" id="rua" placeholder="Rua">

            <label>Número</label>
            <input type="text" id="numero" placeholder="Número">

            <label>Bairro</label>
            <input type="text" id="bairro" placeholder="Bairro">

            <label>Cidade</label>
            <input type="text" id="cidade" placeholder="Cidade">

            <button onclick="cadastrarEndereco()">Adicionar Endereço</button>

        </section>

        <section class="lista">

            <h3>Clientes cadastrados</h3>

            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>CPF</th>
                        <th>E-mail</th>
                        <th>Endereços</th>
                    </tr>
                </thead>

                <tbody id="tabelaClientes"></tbody>

            </table>

        </section>

        <div id="mensagem"></div>

    </main>

    <script src="script.js"></script>

</body>
</html>
