
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Tech Parts</title>
    <link rel="stylesheet" href="/css/cadastro.css">
</head>
<body>

    <div class="container">
        <div class="cadastro-box">

            <h1>TECH <span>PARTS</span></h1>
            <p class="subtitulo">Crie sua conta</p>

            <form id="formCadastro">

                <div class="campo">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" placeholder="Digite seu nome" required>
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="Digite seu e-mail" required>
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="Mínimo de 8 caracteres" minlength="8" required>
                </div>

                <div class="campo">
                    <label for="confirmarSenha">Confirmar senha</label>
                    <input type="password" id="confirmarSenha" placeholder="Digite a senha novamente" required>
                </div>

                <button type="submit">CADASTRAR</button>

                <p id="mensagem"></p>

            </form>

            <p class="login-link">
                Já possui uma conta?
                <a href="login.html">Fazer login</a>
            </p>

        </div>
    </div>

    <script src="/js/cadastro.js"></script>
</body>
</html>
