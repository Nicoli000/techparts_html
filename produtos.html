<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos | Tech Parts</title>
    <link rel="stylesheet" href="/css/produto.css">
</head>
<body>

    <header>
        <h1>TECH PARTS</h1>
        <nav>
            <a href="clientes.html">Clientes</a>
            <a href="produtos.html">Produtos</a>
            <a href="fornecedores.html">Fornecedores</a>
            <a href="estoque.html">Estoque</a>
            <a href="pedidos.html">Pedidos</a>
            <a href="carrinho.html">Carrinho</a>
            <a href="pagamentos.html">Pagamentos</a>
        </nav>
    </header>

    <main>
        <section class="container">
            <h2>Cadastro de Produtos</h2>
            <p>Cadastre e gerencie os produtos de hardware.</p>

            <form id="formProduto">

                <input type="hidden" id="id">

                <div class="campo">
                    <label for="nome">Nome do produto</label>
                    <input type="text" id="nome" required>
                </div>

                <div class="campo">
                    <label for="categoria">Categoria</label>
                    <select id="categoria" required>
                        <option value="">Selecione</option>
                        <option value="Processador">Processador</option>
                        <option value="Placa de vídeo">Placa de vídeo</option>
                        <option value="Memória RAM">Memória RAM</option>
                        <option value="Placa-mãe">Placa-mãe</option>
                        <option value="Armazenamento">Armazenamento</option>
                        <option value="Fonte">Fonte</option>
                        <option value="Periféricos">Periféricos</option>
                        <option value="Outros">Outros</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="marca">Marca</label>
                    <input type="text" id="marca" required>
                </div>

                <div class="campo">
                    <label for="modelo">Modelo</label>
                    <input type="text" id="modelo" required>
                </div>

                <div class="campo">
                    <label for="descricao">Descrição</label>
                    <textarea id="descricao"></textarea>
                </div>

                <div class="campo">
                    <label for="preco">Preço</label>
                    <input type="number" id="preco" step="0.01" min="0" required>
                </div>

                <div class="campo">
                    <label for="quantidade">Quantidade</label>
                    <input type="number" id="quantidade" min="0" required>
                </div>

                <div class="campo">
                    <label for="fornecedor_id">ID do fornecedor</label>
                    <input type="number" id="fornecedor_id" min="1">
                </div>

                <div class="botoes">
                    <button type="submit" id="btnSalvar">Cadastrar Produto</button>
                    <button type="button" id="btnLimpar">Limpar</button>
                </div>

            </form>

            <p id="mensagem"></p>
        </section>

        <section class="container">
            <h2>Produtos Cadastrados</h2>

            <input type="text" id="pesquisa" placeholder="Pesquisar produto...">

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Categoria</th>
                            <th>Marca</th>
                            <th>Modelo</th>
                            <th>Preço</th>
                            <th>Quantidade</th>
                            <th>Fornecedor</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="listaProdutos"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="/js/produtos.js"></script>
</body>
</html>
